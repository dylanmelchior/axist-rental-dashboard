<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/main.css">
    <title>Dashboard</title>
</head>
<body> 
    <table>
        {% for customer in customers %}
            <tr>
                <td>QB ID: {{customer.id}}</td>
                <td>{{customer.name}}</td>
                <td>{{customer.email}}</td>
                <td>{{customer.phone}}</td>
            </tr>
        {% endfor %}
    </table>

    <form method="post" action="/createcustomer/">
        {% csrf_token %}
        <label for = "new-customer-name">Name: </label>
        <input type="text" id="new-customer-name" name = "name" placeholder = "Customer Name" required>

        <label for = "new-customer-email">Email: </label>
        <input type="email" id="new-customer-email" name = "email" placeholder = "Customer Email" required>

        <label for = "new-customer-phone">Phone: </label>
        <input type="tel" id="new-customer-phone" name = "phone" pattern="">
        {% comment %} [0-9]{3}-[0-9]{2}-[0-9]{3} {% endcomment %}

        <label for = "new-customer-QBID">Quickbooks ID: </label>
        <input type="number" id="new-customer-QBID" name = "qbID" required>

        <input type="submit" placeholder = "Create">
    </form>

</body>
</html>
