<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/main.css" />
    <title>Update Customer</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="header-logo">
          <img src="/static/axist_footer_logo.png" />
        </div>
        <div class="home-link">
          <p><a href="/dashboard/">Home</a></p>
        </div>
        <div class="nav-link">
          <p><a href="/customers/">Customers</a></p>
        </div>
      </nav>
    </header>
    <div class="form-wrap">
      <div class="form-card">
        <h2>Update Customer</h2>
        <form method="post" action="/customers/{{customer.id}}/update-post" id="update-customer-form">
          {% csrf_token %}
          <div class="form-row">
            <label for="customer-name">Name</label>
            <input type="text" id="customer-name" name="name" value="{{customer.name}}" required />
          </div>
          <div class="form-row">
            <label for="customer-email">Email</label>
            <input type="email" id="customer-email" name="email" value="{{customer.email}}" required />
          </div>
          <div class="form-row">
            <label for="customer-phone">Phone</label>
            <input type="tel" id="customer-phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" value="{{customer.phone}}" />
          </div>
          <div class="btn-actions">
            <input type="submit" value="Save Changes" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
