<!doctype html>
<html>
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/main.css" />
    <title>New Customer</title>
    </head>
<body>
<form method="post" action="/createrental/" id="create-new-rental-form">
      {% csrf_token %}
      <p>
        <label for="new-rental-qbID">Customer Quickbooks ID: </label>
        <input type="number" id="new-rental-qbID" name="qbID" required />
      </p>

      <p>
        <label for="new-rental-location">Address: </label>
        <input type="text" id="new-rental-location" name="location" required />
      </p>

      <p>
        <label for="new-rental-deliveryDate">Delivery Date/Time: </label>
        <input
          type="datetime-local"
          id="new-rental-deliveryDate"
          name="deliveryDate"
        />
      </p>

      <p>
        <label for="new-rental-eventDateStart">Event Start: </label>
        <input
          type="datetime-local"
          id="new-rental-eventDateStart"
          name="eventStart"
        />
      </p>

      <p>
        <label for="new-rental-eventDateEnd">Event End: </label>
        <input
          type="datetime-local"
          id="new-rental-eventDateEnd"
          name="eventEnd"
        />
      </p>

      <p>
        <label for="new-rental-pickupDate">Pickup Date/Time: </label>
        <input
          type="datetime-local"
          id="new-rental-pickupDate"
          name="pickupDate"
        />
      </p>

      <table class="item-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody class="item-table-body"></tbody>
      </table>
      <button type="button" id="add-item-row">Add Item</button>

      <p><input type="submit" /></p>
    </form>

    <script>
    let rowCount = 0;
    const itemOptions = `<option value="">-- Select --</option>
    {% for item in items %}
    <option value="{{ item.pk }}">{{ item.name }}</option>
    {% endfor %}`;

    function createItemRow() {
        const tBody = document.querySelector(".item-table-body");
        const i = rowCount++;

        const row = document.createElement("tr");
        row.id = `row-${i}`;
        row.innerHTML = `
      <td><select name="items-${i}-item_id" onchange="populateRow(${i}, this.value)">${itemOptions}</select></td>
      <td><input type="text"   name="items-${i}-description" id="desc-${i}"></td>
      <td><input type="number" name="items-${i}-quantity"    id="qty-${i}" value="1" oninput="calcTotal(${i})"></td>
      <td><input type="number" name="items-${i}-unit_price"  id="price-${i}" oninput="calcTotal(${i})"></td>
      <td><input type="text"   name="items-${i}-total"       id="total-${i}" readonly></td>
      <td><button type="button" onclick="removeRow(${i})">✕</button></td>`;
        tBody.appendChild(row);
    }

    function populateRow(i, itemId) {
        if (!itemId) return;
            fetch(`/item/${itemId}/`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById(`desc-${i}`).value  = data.description;
                    document.getElementById(`price-${i}`).value = data.price;
                    calcTotal(i);
        });
    }

    function calcTotal(i) {
        const qty   = parseFloat(document.getElementById(`qty-${i}`).value)   || 0;
        const price = parseFloat(document.getElementById(`price-${i}`).value) || 0;
        document.getElementById(`total-${i}`).value = (qty * price).toFixed(2);
    }

    function removeRow(i) {
        document.getElementById(`row-${i}`).remove();
    }

    document.querySelector("#add-item-row").addEventListener("click", createItemRow);
    </script>
</body>
</html>
